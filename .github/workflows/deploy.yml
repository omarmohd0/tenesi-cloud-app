name: Tenesi DevOps Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Chukua code kutoka GitHub
        uses: actions/checkout@v3

      - name: Weka Terraform kwenye Runner
        uses: hashicorp/setup-terraform@v2

      - name: Weka na uhakiki Terraform Configuration
        run: |
          terraform init -backend=false
          terraform validate

      - name: Jenga Docker Image ya App
        run: docker build -t tenesi-cloud-app:latest .

      - name: Weka na uhakiki Ansible Syntax
        run: |
          sudo apt-get update && sudo apt-get install -y ansible
          ansible-playbook --syntax-check playbook.yml

      - name: Ujumbe wa Mafanikio ya CI/CD
        run: echo "Pipeline ya Tenesi Cloud App imepita vipimo vyote kwa mafanikio makubwa!"
